name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - '*.json'
      - '*.js'
      - '*.ts'
      - 'lib/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        node-version: [24.x, 25.x]
        platform:
        - os: ubuntu-latest
          shell: bash
        - os: macos-latest
          shell: bash
        - os: windows-latest
          shell: bash
        - os: windows-latest
          shell: powershell
      fail-fast: false

    runs-on: ${{ matrix.platform.os }}
    defaults:
      run:
        shell: ${{ matrix.platform.shell }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Use Nodejs ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run Tests
        run: npm test -- -c -t0

      - name: Debug exit code (try branch only)
        if: always()
        shell: bash
        run: |
          set +e
          npx tap -t0 test/perf.ts > /dev/null; echo "single-file tap exit=$?"
          npx tap -t0 test/perf.ts --no-coverage-report > /dev/null; echo "single-file no-report exit=$?"
          npx tap -t0 --disable-coverage test/perf.ts > /dev/null; echo "single-file disable-coverage exit=$?"
          ls -la .tap .tap/plugins; cat .tap/plugins/package.json
          ls .tap/plugins/node_modules/@tapjs | tr '\n' ' '
          npx tap version; npx tap plugin list
          true

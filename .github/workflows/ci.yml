name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - '*.json'
      - '*.js'
      - '*.ts'
      - 'lib/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        node-version: [24.x, 25.x]
        platform:
        - os: ubuntu-latest
          shell: bash
        - os: macos-latest
          shell: bash
        - os: windows-latest
          shell: bash
        - os: windows-latest
          shell: powershell
      fail-fast: false

    runs-on: ${{ matrix.platform.os }}
    defaults:
      run:
        shell: ${{ matrix.platform.shell }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Use Nodejs ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Debug sequence (try branch only)
        shell: bash
        run: |
          set +e
          npm run prepare > /dev/null 2>&1; echo "prepare exit=$?"
          npx tap build > /tmp/b.txt 2>&1; echo "tap build exit=$?"; tail -20 /tmp/b.txt
          ls .tap/plugins/node_modules/@tapjs | tr '\n' ' '; echo
          npx tap -c -t0 > /tmp/a1.txt 2>&1; echo "tap run1 exit=$?"; grep -vE "PASS|^\s*$" /tmp/a1.txt | tail -15
          npx tap -c -t0 > /tmp/a2.txt 2>&1; echo "tap run2 exit=$?"
          npm test -- -c -t0 > /tmp/a3.txt 2>&1; echo "npm test run3 exit=$?"
          node -e "process.exitCode=0" ; echo "node ok=$?"
          true
